name: Deploy AdoTimeTracker.Core

on:
  push:
    branches: ["master"]
    paths:
      - "AdoTimeTracker.Core/**"

  pull_request:
    branches: ["master"]
    paths:
      - "AdoTimeTracker.Core/**"

jobs:
  build-and-deploy:
    runs-on: windows-latest

    permissions:
      contents: read
      id-token: write

    strategy:
      matrix:
        project:
          - "AdoTimeTracker.Core/AdoTimeTracker.Core.csproj"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore "${{ matrix.project }}"
        
      - name: Build
        run: |
          dotnet build "${{ matrix.project }}" `
            --configuration Release `
            --no-restore
            
      - name: Pack NuGet package
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          dotnet pack "${{ matrix.project }}" `
            --configuration Release `
            --no-build `
            --output "./nupkg"
            
      - name: Verify NuGet package
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        shell: pwsh
        run: |
          $packages = Get-ChildItem "./nupkg/*.nupkg"

          if ($packages.Count -eq 0) {
            Write-Error "No NuGet package was generated."
            exit 1
          }

          Write-Host "NuGet package(s) generated:"
          $packages | ForEach-Object {
            Write-Host "  $($_.FullName)"
          }
          
      - name: NuGet Login (OIDC)
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}
          
      - name: Publish NuGet package
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        shell: pwsh
        run: |
          $packages = Get-ChildItem ".\nupkg\*.nupkg"

          foreach ($package in $packages) {
            Write-Host "Publishing $($package.Name)..."

            dotnet nuget push $package.FullName `
              --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" `
              --source "https://api.nuget.org/v3/index.json" `
              --skip-duplicate
          }